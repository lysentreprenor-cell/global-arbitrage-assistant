plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'pl.gadacz.app'
    compileSdk 34

    defaultConfig {
        applicationId "pl.gadacz.app"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "1.2"
    }

    // Fixed signing key so EVERY build has the SAME signature — required for
    // install-over-update and for the in-app auto-updater to work.
    signingConfigs {
        gadacz {
            storeFile file("../gadacz-release.keystore")
            storePassword "gadacz123"
            keyAlias "gadacz"
            keyPassword "gadacz123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.gadacz
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.gadacz
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
