name: Build Android APK

on:
  push:
    paths:
      - "mobile/**"
      - "client/**"
      - "server/routes/**"
      - "vite.mobile.config.ts"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL of the deployed server (e.g. https://my-app.replit.app)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      APP_SERVER_URL: ${{ github.event.inputs.server_url || vars.APP_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build app web bundle
        working-directory: .
        run: |
          npm ci --ignore-scripts
          npx vite build --config vite.mobile.config.ts

      - run: npm ci
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: itemprise-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to apk-build branch
        working-directory: mobile/android/app/build/outputs/apk/debug
        run: |
          mkdir -p /tmp/apk && cp app-debug.apk /tmp/apk/ItemPrise-debug.apk
          cd /tmp/apk
          git init -q -b apk-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ItemPrise-debug.apk
          git commit -qm "APK build from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
