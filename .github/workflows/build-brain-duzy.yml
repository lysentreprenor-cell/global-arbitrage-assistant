name: Zbuduj duzy mozg (konwersja Qwen -> .task)

# 🦉 NASZ WLASNY DUZY MOZG. Bierze OTWARTY model Qwen (licencja Apache, bez bramki
# i bez logowania) i przerabia go na format .task, ktory rozumie telefon
# (narzedzia Google AI Edge / LiteRT: konwersja + kwantyzacja = "sciśniecie").
# Publikuje jako gadacz-mozg-duzy.task na wydaniu gadacz-brain.
#
# To EKSPERYMENT: konwersja duzych modeli na darmowym runnerze bywa ciezka
# (pamiec/dysk/wersje narzedzi). Kazdy przebieg to zarazem diagnostyka - logi
# pokazuja dokladnie, gdzie sie zacina, i poprawiamy krok po kroku.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Model HuggingFace (otwarty, Apache)"
        default: "Qwen/Qwen2.5-3B-Instruct"
      prefill:
        description: "Dlugosc kontekstu (prefill) - mniej = mniej pamieci przy konwersji"
        default: "512"
      kv:
        description: "kv_cache_max_len"
        default: "1024"
  push:
    branches: [ claude/teraz-YKMDA ]
    paths: [ ".github/workflows/build-brain-duzy.yml" ]

permissions:
  contents: write

jobs:
  konwersja:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      REPO:    ${{ github.event.inputs.repo || 'Qwen/Qwen2.5-3B-Instruct' }}
      PREFILL: ${{ github.event.inputs.prefill || '512' }}
      KV:      ${{ github.event.inputs.kv || '1024' }}
    steps:
      - name: Zwolnij miejsce na dysku
        run: |
          echo "=== przed czyszczeniem ==="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          echo "=== po czyszczeniu ==="; df -h /

      - name: Dorzuc pamiec wymiany (swap 24 GB) na wypadek duzego modelu
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== pamiec + swap ==="; free -h; echo "=== dysk ==="; df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj narzedzia AI Edge + MediaPipe
        run: |
          python -m pip install --upgrade pip
          # WAZNE: STABILNE, SPOJNE wersje (nie nightly). Nocne paczki ai-edge-torch
          # sa nieaktualne i klocą sie z nowym ai-edge-litert (ImportError na
          # ai_edge_litert.aot.core.types). Stabilny ai-edge-torch sam przypina
          # zgodny ai-edge-litert. transformers<5, bo v5 rozklada przyklady konwertera.
          # Torch CPU z extra-index (lzejszy, bez CUDA).
          pip install \
            ai-edge-torch \
            "transformers<5" \
            tensorflow-cpu \
            mediapipe \
            huggingface_hub \
            accelerate \
            sentencepiece \
            protobuf \
            --extra-index-url https://download.pytorch.org/whl/cpu
          echo "--- wersje (niekrytyczne) ---"
          python - <<'PY'
          import importlib
          for m in ("ai_edge_torch","litert_torch","ai_edge_litert","mediapipe","transformers","torch"):
              try:
                  mod = importlib.import_module(m)
                  print(m, getattr(mod, "__version__", "(brak __version__, ale zaimportowany)"))
              except Exception as e:
                  print(m, "NIEDOSTEPNY:", e)
          PY

      - name: Pobierz surowy model ($REPO)
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          repo = os.environ["REPO"]
          p = snapshot_download(
              repo_id=repo,
              local_dir="ckpt",
              # bierzemy safetensors + tokenizer + config; pomijamy zbedne pliki
              ignore_patterns=["*.bin", "*.pth", "*.gguf", "original/*", "*.onnx"],
          )
          print("Pobrano do:", p)
          import subprocess; subprocess.run(["ls","-la","ckpt"])
          PY

      - name: Konwersja do .tflite (AI Edge, kwantyzacja int8)
        id: tflite
        run: |
          mkdir -p out
          set -o pipefail
          # Wybieramy przyklad konwertera pasujacy do rodziny modelu.
          FAMILY="qwen"
          case "$REPO" in
            *gemma*|*Gemma*) FAMILY="gemma" ;;
            *Phi*|*phi*)     FAMILY="phi2" ;;
            *Llama*|*llama*) FAMILY="llama" ;;
            *) FAMILY="qwen" ;;
          esac
          echo "Rodzina: $FAMILY"
          # Pakiet przemianowano ai_edge_torch -> litert_torch, a skrypt konwersji
          # bywa nazwany roznie. Robot SAM znajduje wlasciwy modul: listuje folder
          # przykladu i probuje kandydatow; gdy import padnie, pokazuje PRAWDZIWY blad.
          python - "$FAMILY" <<'PY' | tee wybor.log
          import importlib, os, sys, traceback
          fam = sys.argv[1]
          root = pkgdir = None
          for r in ("litert_torch", "ai_edge_torch"):
              try:
                  m = importlib.import_module(f"{r}.generative.examples.{fam}")
                  root, pkgdir = r, os.path.dirname(m.__file__); break
              except Exception as e:
                  print(f"[{r}] brak przykladu {fam}: {e}")
          if not pkgdir:
              print("NIE MA przykladu dla rodziny", fam); sys.exit(1)
          print("ROOT:", root)
          files = sorted(os.listdir(pkgdir))
          print("PLIKI w przykladzie:", files)
          # kandydaci: najpierw typowe nazwy, potem KAZDY plik z 'convert' w nazwie
          cands = ["convert_to_tflite", f"convert_{fam}_to_tflite", "convert"]
          cands += [f[:-3] for f in files if f.endswith(".py") and "convert" in f and f[:-3] not in cands]
          chosen = None
          for name in cands:
              mod = f"{root}.generative.examples.{fam}.{name}"
              try:
                  importlib.import_module(mod); chosen = mod; print("DZIALA IMPORT:", mod); break
              except SystemExit:
                  chosen = mod; print("DZIALA (argparse):", mod); break
              except Exception:
                  print(f"--- {mod} nie importuje sie:"); traceback.print_exc()
          if not chosen:
              print("Nie znalazlem dzialajacego skryptu konwersji."); sys.exit(1)
          open("mod.txt", "w").write(chosen)
          PY
          MOD="$(cat mod.txt 2>/dev/null || true)"
          if [ -z "$MOD" ]; then echo "Brak modulu konwersji (szczegoly wyzej)."; exit 1; fi
          echo "Uzywam modulu: $MOD"
          python -m "$MOD" \
            --checkpoint_path ckpt \
            --output_path out \
            --output_name_prefix mozg \
            --prefill_seq_lens "$PREFILL" \
            --kv_cache_max_len "$KV" \
            --quantize dynamic_int8 2>&1 | tee konwersja.log
          echo "--- pliki wynikowe ---"; ls -la out
          TFL=$(ls out/*.tflite 2>/dev/null | head -1 || true)
          if [ -z "$TFL" ]; then echo "Brak .tflite - konwersja nie wyszla"; exit 1; fi
          echo "tflite=$TFL" >> "$GITHUB_OUTPUT"

      - name: Zbuduj .task (bundle z tokenizerem)
        if: steps.tflite.outputs.tflite != ''
        run: |
          python - <<'PY'
          import glob, os
          from mediapipe.tasks.python.genai import bundler
          tfl = sorted(glob.glob("out/*.tflite"))[0]
          # Qwen/Llama/Gemma to tokenizery BPE - MediaPipe czyta tokenizer.json.
          tok = None
          for c in ("ckpt/tokenizer.json", "ckpt/tokenizer.model"):
              if os.path.exists(c): tok = c; break
          assert tok, "Brak pliku tokenizera w ckpt/"
          print("tflite:", tfl, "tokenizer:", tok)
          cfg = bundler.BundleConfig(
              tflite_model=tfl,
              tokenizer_model=tok,
              start_token="<|im_start|>",
              stop_tokens=["<|im_end|>", "<|endoftext|>"],
              output_filename="gadacz-mozg-duzy.task",
              enable_bytes_to_unicode_mapping=True,
          )
          bundler.create_bundle(cfg)
          print("Rozmiar .task:", os.path.getsize("gadacz-mozg-duzy.task"))
          PY
          echo "--- gotowy plik ---"; ls -la gadacz-mozg-duzy.task

      - name: Sprawdz rozmiar
        id: check
        run: |
          if [ ! -f gadacz-mozg-duzy.task ]; then echo "Brak .task"; exit 1; fi
          SIZE=$(stat -c%s gadacz-mozg-duzy.task)
          echo "Rozmiar: $SIZE"
          # Duzy mozg (3B int8) powinien miec > 1 GB. Mniej = cos poszlo nie tak.
          if [ "$SIZE" -lt 1073741824 ]; then echo "Za maly - odrzucam"; exit 1; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Opublikuj duzy mozg
        if: steps.check.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gadacz-brain
          name: "Gadacz — lokalne mozgi"
          files: gadacz-mozg-duzy.task
          make_latest: false

      - name: Zachowaj log konwersji (do diagnostyki)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-konwersji
          path: |
            konwersja.log
          if-no-files-found: ignore
