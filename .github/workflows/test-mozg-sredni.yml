name: Test pisania - Sredni mozg (Qwen 1.5B)

# Uruchamia TEN SAM model, co "Sredni" w telefonie (Qwen 2.5 1.5B Instruct),
# ale na komputerze (robot GitHuba) - i pokazuje, JAK PISZE po polsku na kilku
# probkach. To NIE odtwarza crasha z telefonu (tam inny silnik), tylko sprawdza
# jakosc pisania samego mozgu.
on:
  workflow_dispatch:
  push:
    branches: [ claude/teraz-YKMDA ]
    paths: [ ".github/workflows/test-mozg-sredni.yml" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instaluj narzedzia
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers<5" accelerate sentencepiece
      - name: Test pisania Sredniego mozgu
        run: |
          python - <<'PY'
          from transformers import AutoModelForCausalLM, AutoTokenizer
          import torch
          name = "Qwen/Qwen2.5-1.5B-Instruct"
          print("Wczytuje model:", name)
          tok = AutoTokenizer.from_pretrained(name)
          model = AutoModelForCausalLM.from_pretrained(name, torch_dtype=torch.float32)
          model.eval()
          SYS = ("Jestes Gadacz - polski asystent glosowy. Odpowiadaj PO POLSKU, "
                 "krotko i konkretnie, pelnymi zdaniami, bez gwiazdek i list - tekst bedzie czytany na glos.")
          prompts = [
              "hei",
              "czesc, co robimy?",
              "czy mozesz programowac?",
              "napisz krotki wierszyk o kawie",
              "wyjasnij prosto, czym jest chmura obliczeniowa",
              "napisz jedno zdanie milego powitania dla osoby niewidomej",
          ]
          for p in prompts:
              msgs = [{"role": "system", "content": SYS}, {"role": "user", "content": p}]
              text = tok.apply_chat_template(msgs, tokenize=False, add_generation_prompt=True)
              ids = tok(text, return_tensors="pt")
              with torch.no_grad():
                  out = model.generate(**ids, max_new_tokens=130, do_sample=False,
                                       repetition_penalty=1.1, pad_token_id=tok.eos_token_id)
              ans = tok.decode(out[0][ids.input_ids.shape[1]:], skip_special_tokens=True).strip()
              print("\n" + "=" * 50)
              print("PYTANIE:  ", p)
              print("ODPOWIEDZ:", ans)
          print("\n=== KONIEC TESTU ===")
          PY
