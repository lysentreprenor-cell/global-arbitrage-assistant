name: Zbuduj Gadacz APK

# Buduje aplikację Android Gadacz i wypuszcza gotowy plik APK do pobrania.
# Uruchom ręcznie z zakładki Actions → "Zbuduj Gadacz APK" → Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [ claude/teraz-YKMDA ]
    paths: [ "android/**", ".github/workflows/build-gadacz-apk.yml" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ustaw Android SDK
        uses: android-actions/setup-android@v3

      - name: Nadaj prawa gradlew
        run: chmod +x android/gradlew || true

      - name: Zbuduj debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Wyślij APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Gadacz-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
