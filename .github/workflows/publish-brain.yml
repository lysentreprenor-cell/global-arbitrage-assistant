name: Opublikuj lokalne mozgi Gadacza

# Pobiera kilka malych modeli AI (MediaPipe .task) z publicznych zrodel i publikuje
# je jako pliki na wydaniu GitHub 'gadacz-brain'. Telefon pobiera WYBRANY silnik
# z NASZEGO linku (bez licencji/logowania). Kazdy model osobno (continue-on-error),
# wiec jak jeden link padnie, reszta i tak sie opublikuje.
on:
  workflow_dispatch:
  push:
    branches: [ claude/teraz-YKMDA ]
    paths: [ ".github/workflows/publish-brain.yml" ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - out: gadacz-mozg-mini.task
            url: "https://huggingface.co/litert-community/Qwen2.5-0.5B-Instruct/resolve/main/Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task"
          - out: gadacz-mozg-sredni.task
            url: "https://huggingface.co/litert-community/Qwen2.5-1.5B-Instruct/resolve/main/Qwen2.5-1.5B-Instruct_multi-prefill-seq_q8_ekv1280.task"
    steps:
      - name: Pobierz ${{ matrix.out }}
        id: dl
        continue-on-error: true
        run: |
          echo "Pobieram: ${{ matrix.url }}"
          curl -fL --retry 3 -A "Gadacz-CI" -o "${{ matrix.out }}" "${{ matrix.url }}"
          SIZE=$(stat -c%s "${{ matrix.out }}")
          echo "Rozmiar: $SIZE"
          if [ "$SIZE" -lt 52428800 ]; then echo "Za maly - blad"; rm -f "${{ matrix.out }}"; exit 1; fi

      - name: Opublikuj ${{ matrix.out }}
        if: steps.dl.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gadacz-brain
          name: "Gadacz — lokalne mozgi"
          body: "Modele AI do trybu offline. Aplikacja pobiera wybrany przyciskiem 'Pobierz lokalny mozg'."
          files: ${{ matrix.out }}
          make_latest: false

      # gadacz-mozg.task = domyslny (kompatybilnosc ze starymi wersjami): kopia mini.
      - name: Domyslny (kopia mini)
        if: matrix.out == 'gadacz-mozg-mini.task' && steps.dl.outcome == 'success'
        run: cp gadacz-mozg-mini.task gadacz-mozg.task
      - name: Opublikuj domyslny
        if: matrix.out == 'gadacz-mozg-mini.task' && steps.dl.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gadacz-brain
          files: gadacz-mozg.task
          make_latest: false

  # 🦉 DUZY: probuje 3 kandydatow PO KOLEI i publikuje PIERWSZY, ktory zejdzie bez
  # bramki (401/404). Dzieki temu z trzech linkow wystarczy, ze zadziala jeden.
  duzy:
    runs-on: ubuntu-latest
    steps:
      - name: Znajdz dzialajacego kandydata
        id: pick
        run: |
          CANDIDATES=(
            "https://huggingface.co/litert-community/Gemma3-4B-IT/resolve/main/Gemma3-4B-IT_multi-prefill-seq_q8_ekv2048.task"
            "https://huggingface.co/litert-community/gemma-3n-E4B-it-litert-preview/resolve/main/gemma-3n-E4B-it-int4.task"
            "https://huggingface.co/litert-community/gemma-3n-E2B-it-litert-preview/resolve/main/gemma-3n-E2B-it-int4.task"
            "https://huggingface.co/litert-community/Qwen2.5-3B-Instruct/resolve/main/Qwen2.5-3B-Instruct_multi-prefill-seq_q8_ekv1280.task"
            "https://huggingface.co/litert-community/Phi-4-mini-instruct/resolve/main/Phi-4-mini-instruct_multi-prefill-seq_q8_ekv1280.task"
            "https://huggingface.co/litert-community/Llama-3.2-3B-Instruct/resolve/main/Llama-3.2-3B-Instruct_multi-prefill-seq_q8_ekv1280.task"
          )
          for URL in "${CANDIDATES[@]}"; do
            echo "Probuje: $URL"
            if curl -fL --retry 2 -A "Gadacz-CI" -o gadacz-mozg-duzy.task "$URL"; then
              SIZE=$(stat -c%s gadacz-mozg-duzy.task 2>/dev/null || echo 0)
              echo "  pobrano, rozmiar: $SIZE"
              if [ "$SIZE" -ge 52428800 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; echo "ZADZIALALO: $URL"; exit 0; fi
            fi
            echo "  ten nie dziala, probuje nastepny"
            rm -f gadacz-mozg-duzy.task
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "Zaden z kandydatow na duzy nie zadzialal (wszystkie za bramka)."

      - name: Opublikuj duzy
        if: steps.pick.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gadacz-brain
          files: gadacz-mozg-duzy.task
          make_latest: false

  # 👂 UCHO GADACZA: polski model rozpoznawania mowy Vosk (Apache 2.0) do nasluchu
  # CIAGLEGO bez przerw (slowo-klucz + "stop"). Telefon pobiera z naszego wydania.
  ucho:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz model Vosk (polski, maly)
        id: ear
        continue-on-error: true
        run: |
          curl -fL --retry 3 -A "Gadacz-CI" -o gadacz-ucho.zip \
            "https://alphacephei.com/vosk/models/vosk-model-small-pl-0.22.zip"
          SIZE=$(stat -c%s gadacz-ucho.zip)
          echo "Rozmiar: $SIZE"
          if [ "$SIZE" -lt 10485760 ]; then echo "Za maly - blad"; rm -f gadacz-ucho.zip; exit 1; fi
      - name: Opublikuj ucho
        if: steps.ear.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gadacz-brain
          files: gadacz-ucho.zip
          make_latest: false

  # 👄 USTA GADACZA: polskie glosy Piper w formacie sherpa-onnx — piekne,
  # naturalne glosy offline. Przepakowujemy tar.bz2 na zip (telefon umie zip).
  usta:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - out: gadacz-usta.zip
            model: vits-piper-pl_PL-gosia-medium
          - out: gadacz-usta-darkman.zip
            model: vits-piper-pl_PL-darkman-medium
          - out: gadacz-usta-mcspeech.zip
            model: vits-piper-pl_PL-mc_speech-medium
    steps:
      - name: Pobierz glos ${{ matrix.model }}
        id: mouth
        continue-on-error: true
        run: |
          curl -fL --retry 3 -A "Gadacz-CI" -o glos.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/${{ matrix.model }}.tar.bz2"
          mkdir un && tar -xjf glos.tar.bz2 -C un
          (cd un && zip -qr "../${{ matrix.out }}" .)
          SIZE=$(stat -c%s "${{ matrix.out }}")
          echo "Rozmiar: $SIZE"
          if [ "$SIZE" -lt 20000000 ]; then echo "Za maly - blad"; rm -f "${{ matrix.out }}"; exit 1; fi
      - name: Opublikuj ${{ matrix.out }}
        if: steps.mouth.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gadacz-brain
          files: ${{ matrix.out }}
          make_latest: false
