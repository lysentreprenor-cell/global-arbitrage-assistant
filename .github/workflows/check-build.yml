name: Sprawdz budowe (serwer i strona)

# 🛡️ STRAŻNIK BUDOWY + SAMONAPRAWA: po KAZDYM pushu probuje zbudowac serwer i
# strone. Jak cos jest zepsute (np. agent Gadacza nadpisal plik), AUTOMATYCZNIE
# COFA ten commit (revert) i przywraca zdrowa galaz — kod nigdy nie zostaje zepsuty.
on:
  push:
    branches: [ claude/teraz-YKMDA ]
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "script/**"
      - "package.json"
      - ".github/workflows/check-build.yml"

permissions:
  contents: write

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instaluj zaleznosci
        run: npm install --no-audit --no-fund
      - name: Zbuduj (serwer + www)
        run: npm run build

      # 🔁 SAMONAPRAWA: budowa padla → cofnij ostatni commit i przywroc zdrowy stan.
      # Guard [auto-rollback] chroni przed petla (revert sam siebie nie cofa).
      - name: Cofnij zmiane gdy budowa padla
        if: failure() && !contains(github.event.head_commit.message, '[auto-rollback]')
        run: |
          git config user.name "Gadacz Rollback"
          git config user.email "noreply@anthropic.com"
          git revert --no-commit HEAD
          git commit -m "Auto-rollback: ta zmiana psula budowe serwera/strony [auto-rollback]"
          git push origin HEAD:${{ github.ref_name }}
